services:
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: airflow standalone
    image: mental-health-airflow:0.1
    container_name: mental-health-airflow
    ports:
      - "8080:8080"
    environment:
      AIRFLOW_HOME: /opt/airflow/airflow-home
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    volumes:
      - airflow_state:/opt/airflow/airflow-home
      - workflow_models:/opt/airflow/models
      - workflow_processed:/opt/airflow/data/processed

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: mental-health-streamlit:0.1
    container_name: mental-health-streamlit
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /opt/airflow
    volumes:
      - workflow_models:/opt/airflow/models
      - workflow_processed:/opt/airflow/data/processed
    depends_on:
      - airflow

volumes:
  airflow_state:
  workflow_models:
  workflow_processed:
